services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axiom-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=["http://localhost:8080","http://127.0.0.1:8080","http://localhost:3000"]
      - ENABLE_SATELLITE_SCHEDULER=false
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: axiom-frontend
    ports:
      - "8080:8080"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
